<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Information</title>

<style>
/* green colors were used to stay with my website theme */
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #eaf5ef;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* weather box */
.weather-container {
    background: white;
    width: 500px;
    padding: 50px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border-top: 7px solid #2c504d; /* green accent */
}

/* city label */
.city {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 5px;
    color: #325e5a;
}

/* description */
.description {
    color: #325e5a;
    font-size: 16px;
    margin-bottom: 15px;
    text-transform: capitalize;
}

/* temps */
.temperature {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.temperature img {
    width: 70px;
    height: 70px;
}

/* main temps */
.temp-main {
    font-size: 45px;
    font-weight: bold;
    color: #297e69;
}

.temp-secondary {
    color: #297e69;
    font-size: 15px;
}

/* weather details */
.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 10px;
}

.detail-box {
    background: #f3faf6;
    padding: 15px;
    border-radius: 10px;
    font-size: 15px;
    border-left: 7px solid #2c504d;
}

.label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
    color: #297e69;
}
</style>
</head>

<body>

    <!-- weather container -->
<div class="weather-container">
    <div class="city" id="city"></div>
    <div class="description" id="description"></div>

    <!-- temperature display section -->
    <div class="temperature">

        <!-- icon for weather using API icon code -->
        <img id="icon" alt="Weather Icon">

        <!-- values (fahrenheit and celsius) -->
        <div>
            <!-- main temp displayed in fahrenheit -->
            <div class="temp-main" id="tempF"></div>

            <!-- secondary temp displayed in celsius -->
            <div class="temp-secondary" id="tempC"></div>
        </div>
    </div>

    <!-- other weather deatails-->
    <div class="details">

        <!-- min temp -->
        <div class="detail-box">
            <span class="label">Min Temperature</span>
            <span id="tempMin"></span>
        </div>

        <!-- max temp -->
        <div class="detail-box">
            <span class="label">Max Temperature</span>
            <span id="tempMax"></span>
        </div>

        <!-- humidity -->
        <div class="detail-box">
            <span class="label">Humidity</span>
            <span id="humidity"></span>
        </div>

        <!-- cloud cover -->
        <div class="detail-box">
            <span class="label">Cloud Coverage</span>
            <span id="clouds"></span>
        </div>

    </div>

</div>

<!-- extracts info from weather.json -->
<script>
fetch("weather.json")
.then(response => response.json())
.then(data => {

    document.getElementById("city").textContent =
        data.name + ", " + data.sys.country;

    document.getElementById("description").textContent =
        data.weather[0].description;

        // convert temps from kelvin to celsius and fahrenheit
    let kelvin = data.main.temp;
    let celsius = (kelvin - 273.15).toFixed(1);
    let fahrenheit = ((kelvin - 273.15) * 9/5 + 32).toFixed(1);

    document.getElementById("tempF").textContent =
        fahrenheit + "°F";

    document.getElementById("tempC").textContent =
        celsius + "°C";

    let minK = data.main.temp_min;
    let minC = (minK - 273.15).toFixed(1);
    let minF = ((minK - 273.15) * 9/5 + 32).toFixed(1);

    document.getElementById("tempMin").textContent =
        minF + "°F (" + minC + "°C)";

    let maxK = data.main.temp_max;
    let maxC = (maxK - 273.15).toFixed(1);
    let maxF = ((maxK - 273.15) * 9/5 + 32).toFixed(1);

    document.getElementById("tempMax").textContent =
        maxF + "°F (" + maxC + "°C)";

    document.getElementById("humidity").textContent =
        data.main.humidity + "%";

    document.getElementById("clouds").textContent =
        data.clouds.all + "%";

        // gets the icon code from API and sets the image source to the corresponding icon URL
    let iconCode = data.weather[0].icon;
    document.getElementById("icon").src =
        "https://openweathermap.org/img/wn/" + iconCode + "@2x.png";

})

// if any errors occur, this shows on console.
.catch(error => console.error("Error loading weather:", error));
</script>

</body>
</html>
