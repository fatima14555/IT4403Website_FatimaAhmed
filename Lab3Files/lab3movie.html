<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Information</title>

<style>
/* background */
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #eaf5ef;
    display: flex;
    justify-content: center;
    padding: 30px;
}

/* movie container */
.movie-container {
    background: white;
    width: 850px;
    padding: 45px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    border-top: 7px solid #2c6f5c; /* green bcs my website */
}

/* movie title (prominent) */
.movie-title {
    font-size: 38px;
    font-weight: bold;
    color: #0e5c46;
    margin-bottom: 10px;
}

/* info including genre, rating, runtime */
.meta {
    color: #0b8462;
    margin-bottom: 15px;
}

/* ratings */
.rating-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

/* for emphasizing the ratings */
.rating-badge {
    background: #2c6f5c;
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    font-weight: bold;
}

/* styling for the sections */
.section {
    margin-top: 15px;
}

/* titles of the sections */
.section h3 {
    color: #0e5c46;
    border-left: 5px solid #2c6f5c;
    padding-left: 8px;
    margin-bottom: 6px;
}

/* styling for cast names */
.section ul {
    list-style-type: disc;  
    padding-left: 20px;     
    margin-top: 4px;
}

.section ul li {
    margin-bottom: 6px;      
    line-height: 1.5;
}

/* synopsis */
.synopsis {
    line-height: 1.6;
    color: #000000;
}

/* i wanted the critics consensus to be italicized */
#consensus {
    font-style: italic;
}

</style>
</head>

<body>

<!-- movie container -->
<div class="movie-container">
    <div class="movie-title" id="title"></div>

    <div class="meta" id="meta"></div>

    <div class="rating-row">
        <div class="rating-badge" id="critics"></div>
        <div class="rating-badge" id="audience"></div>
    </div>

    <div class="section">
        <h3>Director</h3>
        <p id="director"></p>
    </div>

    <div class="section">
        <h3>Main Cast</h3>
        <ul id="cast"></ul>
    </div>

    <div class="section">
        <h3>Synopsis</h3>
        <p class="synopsis" id="synopsis"></p>
    </div>

    <div class="section">
        <h3>Critics Consensus</h3>
        <p id="consensus"></p>
    </div>

</div>

<script>
// gets the movie.json file
fetch("movie.json")
.then(response => response.json())  // js object from json string
.then(data => {

    // all the code below are the elements that will be displayed on the webpage, using the data from the json file.
    // styled in the same way as you would see on a movie review website, with the title and ratings emphasized visually.
    document.getElementById("title").textContent =
        data.title + " (" + data.year + ")";

    document.getElementById("meta").textContent =
        data.genres.join(", ") +
        " | Rated " + data.mpaa_rating +
        " | " + data.runtime + " minutes";

    document.getElementById("critics").textContent =
        "Critics: " + data.ratings.critics_score + "%";

    document.getElementById("audience").textContent =
        "Audience: " + data.ratings.audience_score + "%";

    document.getElementById("director").textContent =
        data.abridged_directors[0].name;

    // loops through the cast array to show the main cast members and their characters in a list format.
    // cast members names are bolded. 
    let castList = document.getElementById("cast");

    data.abridged_cast.forEach(actor => {
        let li = document.createElement("li");
        li.innerHTML =
            "<strong>" + actor.name + "</strong> as " + actor.characters.join(", ");
        castList.appendChild(li);
    });

    document.getElementById("synopsis").textContent =
        data.synopsis;

    document.getElementById("consensus").textContent =
        data.critics_consensus;

})

// if there is an error, this will show.
.catch(error => console.error("Error loading movie:", error));
</script>

</body>
</html>
