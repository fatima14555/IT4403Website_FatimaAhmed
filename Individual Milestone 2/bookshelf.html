<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bookshelf – Milestone 2</title>

  <!-- google fonts to make the text look nicer -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- jQuery library -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    /* CSS colors. pastel purplish theme */
    :root {
      --bg:        #fdf6f9;
      --surface:   #ffffff;
      --nav-bg:    #3d2645;
      --primary:   #c084a0;
      --primary-dk:#a8667f;
      --accent:    #e8c4d4;
      --lilac:     #d8b4d8;
      --lilac-bg:  #f3eaf6;
      --border:    #edd8e8;
      --text:      #2e1a2e;
      --muted:     #9c7a90;
      --radius:    15px;
      --shadow:    0 4px 20px rgba(192,132,160,.12);
    }

        /* makes the layout consistent */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* navigation bar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--nav-bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* title of the site */
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: #f0d8e8;
      text-decoration: none;
      letter-spacing: .5px;
    }

    .nav-links { 
      display: flex; 
      gap: 1.4rem; 
    }

    .nav-links a {
      color: #c8aac0;
      text-decoration: none;
      font-weight: 600;
      font-size: .98rem;
      padding: .35rem .75rem;
      border-radius: 6px;
      transition: color .2s, background .2s;
    }

    /* the page that you are on stays highlighted in the nav bar */
    .nav-links a:hover,
    .nav-links a.active {
      color: #f8e4f0;
      background: rgba(216,180,216,.18);
    }

    /* the hero section under the nav bar  */
    .shelf-hero {
      background: linear-gradient(135deg, var(--nav-bg) 0%, #5c3460 100%);
      color: #fff;
      padding: 3.5rem 2rem 2.5rem;
      text-align: center;
    }

    .shelf-hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 4vw, 2.6rem);
      color: #f8e8f4;
      margin-bottom: .4rem;
    }

    .shelf-hero p { 
      color: #c8a8c4; 
      font-size: 1.0rem;
    }

    /* main container section */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    /* book grid section */
    /* auto-fill = as many columns that fit at min 165px wide */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 1.5rem;
    }

    /* book cards styling */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .25s, box-shadow .25s;
      display: flex;
      flex-direction: column;
      text-decoration: none;   /* removes the underline from title and author*/
      color: inherit;          /* makes sure the title or author dont show as default blue links */
    }

    /* when you hover over a book card, it lifts up slightly */
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(192,132,160,.22);
    }

    /* fixed height keeps all cover images the same size */
    .book-card .cover-wrap {
      background: var(--lilac-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 210px;
      overflow: hidden;
    }

    .book-card .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .3s;
    }

    /* cover image is zoomed in slightlty when hovering on it */
    .book-card:hover .cover-wrap img { 
      transform: scale(1.04);
    }

    /* when no image is provided, a placeholder is shown */
    .no-cover {
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .book-card .card-body {
      padding: .85rem 1rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .book-card .card-title {
      font-weight: 800;
      font-size: .90rem;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
      /* clamp is so that the layout isn't stretched for books with long titles. limited to 2 lines */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-card .card-title:hover { 
      color: var(--primary); 
    }

    .book-card .card-author {
      font-size: .80rem;
      color: var(--primary-dk);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* a loading spinner while the content loads */
    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary); /* only top being colored adds a spin illusion */
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* no results is for error styling */
    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      font-size: 1rem;
      color: var(--muted);
    }

    /* hides any elements that don't need to be shown*/
    .hidden { display: none !important; }

    /* footer */
    .footer {
      text-align: center;
      padding: 1.5rem;
      background: var(--nav-bg);
      color: #9a7898;
      font-size: .85rem;
      margin-top: auto;
    }
  </style>
</head>

<body>

  <!-- nav bar -->
  <nav class="navbar">
    <a href="index.html" class="logo">Milestone 2 — Public Bookshelf</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="bookshelf.html" class="active">My Bookshelf</a>
    </div>
  </nav>

  <!-- hero section -->
  <header class="shelf-hero">
    <h1>My Google Books Bookshelf</h1>
    <p>A personalized collection of books</p>
  </header>

  <!-- main container -->
  <main class="container">

    <!-- spinner shown while books are loading -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading my bookshelf...</p>
    </div>

    <!-- shown if there is an API error. hidden by default -->
    <div id="noResults" class="no-results hidden">
      <p>Could not load the books from my bookshelf. Please try again later.</p>
    </div>

    <!-- book cards go into the book grid using JS -->
    <div id="booksGrid" class="books-grid"></div>

  </main>

  <!-- footer -->
  <footer class="footer">
    <p>Milestone 2 — Public Bookshelf App &mdash; Google Books API</p>
  </footer>


  <script>
    /* configurations */

    // my API key for Google Books API. ensures that the API works cuz higher quota.
    const API_KEY = "AIzaSyBOJ9CK-iThAPfb4GZIQ-x9sYsxmhJnCEY";

    /* volume IDs of books from my public
       Google Books shelf collection */
    const MY_BOOK_IDS = [
      "rbONEQAAQBAJ", 
      "fYlMx-xzzh4C",
      "fkc10_zCBv0C",
      "Dvt4rPSKJf8C",
      "dcSbDwAAQBAJ",
    ];


    /* jQuery document ready */
    $(function () {

      // this is if no volume IDs are there. shows a message instead of an empty grid. also hides the spinner.
      if (MY_BOOK_IDS.length === 0) {
        $("#loading").addClass("hidden");
        $("#noResults").removeClass("hidden");
        return;
      }

      loadBookshelf();
    });


    /* loadBookshelf() sends one API request per book ID.
       $.when() waits for ALL of them to complete before showing the grid. */
    function loadBookshelf() {

      // one $.getJSON call per book ID
      // each one fetches GET /volumes/{id}
      const requests = MY_BOOK_IDS.map(function (id) {
        return $.getJSON(
          `https://www.googleapis.com/books/v1/volumes/${id}?key=${API_KEY}`
        );
      });

      // passes each request as a separate argument to $.when()
      $.when(...requests)
        .done(function () {

          // normalizes the arguments into an array
          let results;
          if (MY_BOOK_IDS.length === 1) {
            results = [arguments[0]];
          } else {
            results = Array.from(arguments).map(function (a) { return a[0]; });
          }

          // hides the loading spinner after all requests are done
          $("#loading").addClass("hidden");

          // provides a card for each book
          results.forEach(function (book) {
            renderCard(book);
          });

          // books fade-in and each card waits 80ms longer than the previous one. creates a staggered look.
          $(".book-card").hide().each(function (i) {
            $(this).delay(i * 80).fadeIn(350);
          });

        })
        .fail(function () {
          // shows an error if any requests failed
          $("#loading").addClass("hidden");
          $("#noResults").removeClass("hidden");
        });
    }


    /* single card for each book. || is for if one of the fields isn't available. */
    function renderCard(book) {
      const info    = book.volumeInfo || {};
      const title   = info.title  || "Unknown Title";
      const authors = (info.authors || ["Unknown Author"]).join(", ");

      // thumbnail URL is used if available, otherwise there's a placeholder with text
      const cover = info.imageLinks
        ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)
        : null;

      const imgHtml = cover
        ? `<img src="${cover}" alt="${title}" loading="lazy" />`
        : `<span class="no-cover">No Cover</span>`;

      // clicking anywhere on the card will take you to the details page (image, title, etc)
      const card = `
        <a class="book-card" href="details.html?id=${book.id}">
          <div class="cover-wrap">${imgHtml}</div>
          <div class="card-body">
            <span class="card-title">${title}</span>
            <span class="card-author">${authors}</span>
          </div>
        </a>`;

      $("#booksGrid").append(card);
    }
  </script>

</body>
</html>
