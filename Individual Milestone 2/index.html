<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Search – Milestone 2</title>

  <!-- google fonts for better typography -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- jQuery library -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    /* CSS colors/ blush colour palette. i put all the colors here so if i change one, it updates everywhere */
    :root {
      --bg:        #fdf6f9;   
      --surface:   #ffffff;   
      --nav-bg:    #3d2645;   /* deep plum for navbar/footer */
      --primary:   #c084a0;   /* rose for buttons, active links */
      --primary-dk:#a8667f;   /* darker rose for hover color */
      --accent:    #e8c4d4;   
      --lilac:     #d8b4d8;   /* soft lilac for the tags */
      --lilac-bg:  #f3eaf6;   
      --border:    #edd8e8;   
      --text:      #2e1a2e;   /* dark purple text*/
      --muted:     #9c7a90;   /* for text that is less prominent*/
      --radius:    15px;
      --shadow:    0 4px 20px rgba(192,132,160,.12);
    }

    /* makes the elements consistent */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* nav  bar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--nav-bg);
      position: sticky; /* sticks to top when the user scrolls down so nav stays visible */
      top: 0;
      z-index: 100;
    }

    /* title of site */
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: #f0d8e8;
      text-decoration: none;
      letter-spacing: .5px;
    }

    .nav-links { 
      display: flex; 
      gap: 1.4rem; 
    }

    .nav-links a {
      color: #c8aac0;
      text-decoration: none;
      font-weight: 600;
      font-size: .98rem;
      padding: .35rem .75rem;
      border-radius: 6px;
      transition: color .2s, background .2s; /* hover effect */
    }

    /* highlights current nav link */
    .nav-links a:hover,
    .nav-links a.active {
      color: #f8e4f0;
      background: rgba(216,180,216,.18);
    }

    /* hero section under nav bar */
    .hero {
      background: linear-gradient(135deg, var(--nav-bg) 0%, #5c3460 100%);
      color: #fff;
      padding: 4rem 2rem 3rem;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 5vw, 3.6rem); /* responsive: min 2rem, max 3rem */
      line-height: 1.2;
      margin-bottom: .6rem;
      color: #f8e8f4;
    }

    .hero p {
      color: #c8a8c4;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    /* search bar */
    .search-bar {
      display: flex;
      max-width: 700px;
      margin: 0 auto;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 4px 28px rgba(0,0,0,.3);
    }

    .search-bar input {
      flex: 1; 
      border: none;
      padding: .95rem 1.4rem;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .search-bar button {
      background: var(--primary);
      border: none;
      padding: .98rem 1.8rem;
      font-size: .98rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      color: #fff;
      cursor: pointer;
      transition: background .2s;
    }

    .search-bar button:hover { 
      background: var(--primary-dk); 
    }

    /* main container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    /* results header */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .8rem;
      margin-bottom: 1.5rem;
      font-size: .98rem;
      color: var(--muted);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .pagination-controls select {
      padding: .4rem .7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-size: .87rem;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    /* books grid */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 1.5rem;
    }

    /* book card */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .25s, box-shadow .25s;
      display: flex;
      flex-direction: column;
      text-decoration: none;    /* removes the underline from title and author*/
      color: inherit;           /* makes sure the title or author dont show as default blue links */
    }

    /* lifts the card a little on hover */
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(192,132,160,.22);
    }

    /* keeps cards uniform in height */
    .book-card .cover-wrap {
      background: var(--lilac-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 210px;
      overflow: hidden;
    }

    .book-card .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .3s;
    }

    /* zooms in on cover image when hovering */
    .book-card:hover .cover-wrap img { 
      transform: scale(1.04); 
    }

    /* placeholder for books without covers */
    .no-cover {
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .book-card .card-body {
      padding: .85rem 1rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .book-card .card-title {
      font-weight: 800;
      font-size: .90rem;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
      /* long titles are limited to 2 lines then ... is shown */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-card .card-title:hover { 
      color: var(--primary); 
    }

    .book-card .card-author {
      font-size: .80rem;
      color: var(--primary-dk);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* spinner for loading state */
    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary); 
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* for error handling */
    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      font-size: 1rem;
      color: var(--muted);
    }

    /* hides elements that dont need to be shown */
    .hidden { display: none !important; }

    /* footer */
    .footer {
      text-align: center;
      padding: 1.5rem;
      background: var(--nav-bg);
      color: #9a7898;
      font-size: .85rem;
      margin-top: auto;
    }
  </style>
</head>

<body>

  <!-- navigation bar -->
  <nav class="navbar">
    <a href="index.html" class="logo">Milestone 2 — Google Books Search</a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="bookshelf.html">My Bookshelf</a>
    </div>
  </nav>

  <!-- hero section -->
  <header class="hero">
    <h1>Search for Books</h1>
    <p>Supported by the Google Books API</p>

    <div class="search-bar">
      <!-- searchInput is targeted by jQuery -->
      <input type="text" id="searchInput" placeholder="Enter a title, author, or keyword..." />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- results start hidden and are revealed by JavaScript after a search runs -->
  <main class="container">

    <!-- result count and page selector are hidden until a search completes -->
    <div id="resultsHeader" class="results-header hidden">
      <span id="resultsCount"></span>
      <div class="pagination-controls">
        <label for="pageSelect">Page:</label>
        <select id="pageSelect"></select>
      </div>
    </div>

    <!-- spinner while API is loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Searching for books...</p>
    </div>

    <!-- message shown if API returns zero results -->
    <div id="noResults" class="no-results hidden">
      <p>No books were found. Try a different search term.</p>
    </div>

    <!-- book cards inserted into the grid by JS -->
    <div id="booksGrid" class="books-grid"></div>

  </main>

  <!-- footer -->
  <footer class="footer">
    <p>Milestone 2 — Book Search App &mdash; Google Books API</p>
  </footer>


  <script>
    /* configurations section */
    // my API key for google books api. used cuz i needed a higher quota. 
    const API_KEY = "AIzaSyBOJ9CK-iThAPfb4GZIQ-x9sYsxmhJnCEY";

    /* max number of results to fetch from API (google books API only allows max 40
     but assignment requires 60) */
    const MAX_RESULTS = 60;

    // i chose 12 results to show per page 
    const PER_PAGE = 12;


    /* variables */

    let allBooks = []; // stores every book object returned by the API
    let currPage = 1;  // tracks the page the user is currently viewing


    /* jQuery document ready */
    $(function () {

      // allows pressing enter for the search box instead of clicking the button
      $("#searchInput").on("keypress", function (e) {
        if (e.key === "Enter") doSearch();
      });

      // search button click handler
      $("#searchBtn").on("click", doSearch);

      // when user picks a different page from the dropdown, updates currPage and re-renders the grid
      $("#pageSelect").on("change", function () {
        currPage = parseInt($(this).val()); // read the selected page number
        renderPage();                       // re-draw the grid for that page

        // scroll back to the top of the results so user doesn't have to manually scroll up after changing pages
        $("html, body").animate(
          { scrollTop: $(".container").offset().top - 80 },
          300
        );
      });

    });


    /* doSearch is because 60 results are required for the assignment but 
       the API only allows 40 per request
       so 2 requests are made and merged together before displaying them */
    function doSearch() {
      const query = $("#searchInput").val().trim();

      // nothing happens if the search box is empty
      if (!query) return;

      // resets for new search
      allBooks = [];
      currPage = 1;
      $("#booksGrid").empty();
      $("#resultsHeader").addClass("hidden");
      $("#noResults").addClass("hidden");
      $("#loading").removeClass("hidden");

      // base URL is used for both requests so that they dont need to be repeated
      const base = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}`;

      // request 1 is for books 0 to 39 (startIndex=0, maxResults=40)
      const req1 = $.getJSON(`${base}&startIndex=0&maxResults=40&key=${API_KEY}`);

      // request 2 is for books 40 to 59 (startIndex=40, maxResults=20)
      const req2 = $.getJSON(`${base}&startIndex=40&maxResults=20&key=${API_KEY}`);

      // $.when() waits for both requests to complete before running .then()
      $.when(req1, req2).then(function (res1, res2) {

        const items1 = res1[0].items || []; // may be empty if no results
        const items2 = res2[0].items || [];

        /* it should be noted that Google Books API caps results at 40 even if more are needed so 
        items2 will often be empty even if there are more than 40 results available.
        this was just to try it out and see. if Google Books API changes cap limit in the future, this
        will work for up to 60 results */
        allBooks = [...items1, ...items2].slice(0, MAX_RESULTS); // merges both and caps to MAX_RESULTS

        // hides the loading spinner
        $("#loading").addClass("hidden");

        if (allBooks.length === 0) {
          // if nothing is found, the no results message is shown
          $("#noResults").removeClass("hidden");
          return;
        }

        // populates the page dropdown and displays the first page
        buildPageDropdown();
        renderPage();

        // shows the result count and pagination row above the grid
        $("#resultsHeader").removeClass("hidden");
        $("#resultsCount").text(`Showing ${allBooks.length} results for "${query}"`);

      }).fail(function () {
        // if either API call fails, error message is shown instead of the grid
        $("#loading").addClass("hidden");
        $("#noResults").removeClass("hidden")
          .find("p").text("API error. Try again later.");
      });
    }


    /* buildPageDropdown()
       calculates total pages needed and fills the
       <select> element with one <option> per page. */
    function buildPageDropdown() {
      const totalPages = Math.ceil(allBooks.length / PER_PAGE);
      const $select = $("#pageSelect").empty(); // clear any old options first

      for (let i = 1; i <= totalPages; i++) {
        $select.append(`<option value="${i}"> ${i} of ${totalPages}</option>`);
      }
    }


    /* renderPage() slices allBooks to only the current page,
       builds a card for each book, appends them
       to the grid, then shows them one by one with a fade effect */
    function renderPage() {
      // calculates which slice of allBooks belongs to currPage
      const start = (currPage - 1) * PER_PAGE;
      const end   = start + PER_PAGE;
      const slice = allBooks.slice(start, end);

      // clears old cards and syncs the dropdown to the current page
      $("#booksGrid").empty();
      $("#pageSelect").val(currPage);

      // builds a card for each book in the current page slice
      slice.forEach(function (book) {
        const info    = book.volumeInfo || {};
        const title   = info.title || "Unknown Title";
        const authors = (info.authors || ["Unknown Author"]).join(", ");

        // uses the thumbnail URL if available, otherwise theres a text placeholder
        const cover = info.imageLinks
          ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)
          : null;

        const imgHtml = cover
          ? `<img src="${cover}" alt="${title}" loading="lazy" />`
          : `<span class="no-cover">No Cover</span>`;

        // clicking anywhere on the book card will take you to details page (image, title, etc.)
        // as a URL query parameter: details.html?id=BOOK_ID
        const card = `
          <a class="book-card" href="details.html?id=${book.id}">
            <div class="cover-wrap">${imgHtml}</div>
            <div class="card-body">
              <span class="card-title">${title}</span>
              <span class="card-author">${authors}</span>
            </div>
          </a>`;

        $("#booksGrid").append(card);
      });

      // fade in makes each card wait 50ms longer than the previous one so it gives a staggered effect to each book
      $(".book-card").hide().each(function (i) {
        $(this).delay(i * 50).fadeIn(300);
      });
    }
  </script>

</body>
</html>
