<!DOCTYPE html>
<html>
<head>
    <title>Lab 4 – Album Info</title>
    <style>
        /*CSS styling*/
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 50px;
            background-color: #f4f7f4;
            color: #415b49;
        }

        h1 {
            color: #446a48;
            border-bottom: 4px solid #6b8e30;
            padding-bottom: 10px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 50px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .photo {
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        img {
            width: 120px;
            border-radius: 8px;
        }
    </style>

</head>
<body>

<h1>Album Information</h1>
<div id="albumInfo" class="card"></div>

<h1>Photos</h1>
<div id="photos" class="gallery"></div>

<script>
    // fetches album details and photos based on the albumId param
const params = new URLSearchParams(window.location.search); 
const albumId = params.get("albumId");

if (!albumId) { 
    document.getElementById("albumInfo").innerHTML =
        "<p>No album selected. Please go back.</p>";
} else {

    // fetches album details from API
    fetch(`https://jsonplaceholder.typicode.com/albums/${albumId}`)
    .then(res => res.json())
    .then(album => {
        document.getElementById("albumInfo").innerHTML = `
            <p><strong>Album Title:</strong> ${album.title}</p>
            <p><strong>Album ID:</strong> ${album.id}</p>
            <p><strong>User ID:</strong> ${album.userId}</p>
        `;
    })
    .catch(error => { 
        document.getElementById("albumInfo").innerHTML =
            "Error loading album information.";
        console.error(error);
    });

    // fetches photos for the album and displays them in a gallery
    /* i used picsum.photos to get random images bcs the API uses
    via.placeholder.com which is not loading any images for me */
    
    fetch(`https://jsonplaceholder.typicode.com/photos?albumId=${albumId}`)
    .then(res => res.json())
    .then(photos => {

        if (!photos.length) {
            document.getElementById("photos").innerHTML =
                "No photos found.";
            return;
        }

        let output = "";

        photos.forEach(photo => {
            output += `
                <div class="photo">
                    <img src="https://picsum.photos/id/${photo.id}/300/300" 
                         alt="${photo.title}">
                    <p>${photo.title}</p> 
                </div>
            `;
        });

        document.getElementById("photos").innerHTML = output;
    })
    .catch(error => {
        document.getElementById("photos").innerHTML =
            "Error loading photos.";
        console.error(error);
    });
}
</script>

</body>
</html>
