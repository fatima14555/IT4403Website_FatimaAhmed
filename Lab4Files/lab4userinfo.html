<!DOCTYPE html>
<html>
<head>
    <title>Lab 4 – User Info</title>
    <style>
        /*CSS styling*/
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 50px;
            background-color: #f4f7f4;
            color: #415b49;
        }

        h1 {
            color: #446a48;
            border-bottom: 4px solid #6b8e30;
            padding-bottom: 10px;
        }

        h2 {
            margin-top: 50px;
            color: #4c8356;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 50px;
        }

        .album-link {
            display: block;
            padding: 8px;
            margin: 8px 0;
            background-color: #edece7;
            text-decoration: none;
            color: #456b58;
            border-radius: 5px;
            transition: 0.3s;
        }

        .album-link:hover {
            background-color: #637e32;
            color: white;
        }
    </style>

</head>
<body>

<h1>User Information</h1>
<div id="user" class="card"></div>

<h2>User Albums</h2>
<div id="albums" class="card"></div>

<script>
const userId = 1;  // there is only 1 user ID in the JSONPlaceholder

// fetched user info from the API and displays it
fetch(`https://jsonplaceholder.typicode.com/users/${userId}`)
.then(res => res.json())
.then(user => {
    document.getElementById("user").innerHTML = `
        <p><strong>Name:</strong> ${user.name}</p>
        <p><strong>Email:</strong> ${user.email}</p>
        <p><strong>Address:</strong> ${user.address.street}, ${user.address.city}</p>
        <p><strong>Company:</strong> ${user.company.name}</p>
    `;
});

// fetches albums and displays them as links to the album info page
fetch(`https://jsonplaceholder.typicode.com/albums?userId=${userId}`)
.then(res => res.json())
.then(albums => {
    let output = "";
    albums.forEach(album => {
        output += `
            <a class="album-link" 
               href="lab4albuminfo.html?albumId=${album.id}">
                ${album.title}
            </a>
        `;
    });

    document.getElementById("albums").innerHTML = output;
});
</script>

</body>
</html>
